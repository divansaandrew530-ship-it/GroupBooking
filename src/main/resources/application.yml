spring:
  application:
    name: groupbookingla
  profiles:
    default: prod
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  forward-headers-strategy: framework
  tomcat:
    max-part-count: 1000
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

ruzinn:
  cors:
    # Comma-separated origin patterns allowed to call the API from a browser.
    allowed-origins: ${RUZINN_CORS_ALLOWED_ORIGINS:http://localhost:*,https://quotebooke.com,https://*.quotebooke.com,https://groupbooking.chitaranjan.com}
  auth:
    otp-echo: ${RUZINN_OTP_ECHO:true}
    otp-ttl-minutes: ${RUZINN_OTP_TTL_MINUTES:10}
    super-admin-email: ${RUZINN_SUPER_ADMIN_EMAIL:Admin@rathin.com}
    super-admin-password: "${RUZINN_SUPER_ADMIN_PASSWORD:R@t@2023}"
    super-admin-name: ${RUZINN_SUPER_ADMIN_NAME:Rathin Super Admin}
  uploads:
    directory: ${RUZINN_UPLOADS_DIR:uploads}
  mail:
    # auto = Microsoft Graph when graph.* is set, else SMTP when host is set, else log only.
    # Force one with smtp, graph or log.
    provider: ${RUZINN_MAIL_PROVIDER:auto}
    from-name: ${RUZINN_MAIL_FROM_NAME:Rathin}
    connect-timeout-ms: ${RUZINN_MAIL_CONNECT_TIMEOUT_MS:15000}
    read-timeout-ms: ${RUZINN_MAIL_READ_TIMEOUT_MS:30000}
    graph:
      tenant-id: ${RUZINN_MAIL_GRAPH_TENANT_ID:}
      client-id: ${RUZINN_MAIL_GRAPH_CLIENT_ID:}
      client-secret: ${RUZINN_MAIL_GRAPH_CLIENT_SECRET:}
    host: ${RUZINN_MAIL_HOST:}
    port: ${RUZINN_MAIL_PORT:587}
    username: ${RUZINN_MAIL_USERNAME:}
    password: ${RUZINN_MAIL_PASSWORD:}
    from: ${RUZINN_MAIL_FROM:ruzinn123@gmail.com}
    starttls: ${RUZINN_MAIL_STARTTLS:true}
    ssl: ${RUZINN_MAIL_SSL:false}
    site-url: ${RUZINN_MAIL_SITE_URL:https://groupbooking.chitaranjan.com}

logging:
  level:
    com.ruzinn: INFO
  # Application log file (console output continues as well). Rolls daily and at 10MB; old files are
  # gzipped and kept for 30 days, capped at 1GB in total.
  file:
    name: ${RUZINN_LOG_DIR:logs}/groupbookingla.log
  logback:
    rollingpolicy:
      file-name-pattern: ${RUZINN_LOG_DIR:logs}/groupbookingla-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
